version: "3.9"

services:

  ngrok:
    image: ngrok/ngrok:latest
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040" 
    entrypoint: ["ngrok"]
    command: ["http", "n8n:5678"]
    depends_on:
      - n8n

  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=https
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_TRUST_PROXY=true
    volumes:
      - ${N8N_USER_FOLDER}:/home/node/.n8n

  api:
    build:
      context: .
      dockerfile: src/AiMultiAgent.Mcp.Server/Dockerfile
    container_name: ai-multi-agent
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - API_URI=http://api:7244
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "7244:7244"
    depends_on:
      - n8n

volumes:
  n8n_data:
