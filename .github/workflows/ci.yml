name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
            Directory.Packages.props

      - name: Restore
        run: |
          dotnet restore src/AiMultiAgent.Core/AiMultiAgent.Core.csproj
          dotnet restore src/AiMultiAgent.Mcp.Client/AiMultiAgent.Mcp.Client.csproj
          dotnet restore src/AiMultiAgent.Mcp.Server/AiMultiAgent.Mcp.Server.csproj

      - name: Build Release
        run: |
          dotnet build src/AiMultiAgent.Core/AiMultiAgent.Core.csproj -c Release --no-restore
          dotnet build src/AiMultiAgent.Mcp.Client/AiMultiAgent.Mcp.Client.csproj -c Release --no-restore
          dotnet build src/AiMultiAgent.Mcp.Server/AiMultiAgent.Mcp.Server.csproj -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build
